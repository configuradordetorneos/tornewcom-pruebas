<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partidos finalizados — Sistema de Torneos Newcom</title>
<style>body{font-family:Arial,sans-serif;background:#f3f7fa;color:#243746;margin:0}.top{background:#2F5D7E;color:#fff;padding:18px 24px}.wrap{max-width:1180px;margin:26px auto;padding:0 16px}.card{background:#fff;padding:22px;border-radius:16px}.btn{display:inline-block;background:#4A90C2;color:#fff;padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:bold}.secondary{background:#6c7f8d}select{padding:9px;border:1px solid #bdcbd5;border-radius:8px}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:10px;border-bottom:1px solid #dbe5eb;text-align:left}th{background:#2F5D7E;color:#fff}tbody tr:nth-child(even){background:#EAF4FB}.msg{padding:12px;background:#EAF4FB;border-radius:9px}.np{color:#795f22;font-weight:bold}.gan{font-weight:bold}</style><script src="legal_v12_33.js?v=12.35" defer></script>
</head>
<body><script src="roles_v12_24.js?v=12.35"></script><script>NewcomRoles.exigir(['ADMIN_GENERAL','ORGANIZADOR']);</script><div class="top"><b>TORNEWCOM — V12.37.30 CANDIDATA</b></div><main class="wrap"><p><a class="btn secondary" href="index.html">← Panel</a> <a class="btn" id="irPartidos" href="partidos.html">Partidos</a> <a class="btn" id="irTabla" href="tabla.html">Tabla</a></p><div class="card"><h1>Partidos finalizados</h1><p><b>Torneo:</b> <select id="torneo"></select></p><div id="c" class="msg">Cargando…</div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=12.35"></script><script src="supabase_v12_24.js?v=12.36.19-login5"></script><script>
const sel=document.getElementById('torneo'),c=document.getElementById('c');
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function resultado(p){
 if(p.no_presentado==='AMBOS')return '<span class="np">N/P ambos</span>';
 if(p.no_presentado==='EQUIPO A')return `<span class="np">${esc(p.equipo_a)} N/P</span>`;
 if(p.no_presentado==='EQUIPO B')return `<span class="np">${esc(p.equipo_b)} N/P</span>`;
 return `<b>${Number(p.sets_a)||0} - ${Number(p.sets_b)||0}</b>`;
}
function ganador(p){
 if(p.no_presentado==='AMBOS')return '—';
 if(p.ganador==='A')return esc(p.equipo_a);
 if(p.ganador==='B')return esc(p.equipo_b);
 return '—';
}
async function cargar(){
 const tid=sel.value;
 document.getElementById('irPartidos').href='partidos.html?torneo='+encodeURIComponent(tid);
 document.getElementById('irTabla').href='tabla.html?torneo='+encodeURIComponent(tid)+'&desde=partidos';
 const r=await NewcomSupabase.listarPartidos(tid);
 if(!r.ok){c.className='msg';c.textContent='Error: '+r.error;return;}
 const ps=(r.data||[]).filter(p=>p.estado==='FINALIZADO');
 if(!ps.length){c.className='msg';c.textContent='Todavía no hay partidos finalizados para este torneo.';return;}
 c.className='';
 c.innerHTML=`<table><thead><tr><th>Jornada</th><th>Fecha</th><th>Categoría</th><th>Modalidad</th><th>Partido</th><th>Resultado</th><th>Ganador</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.jornadas?.nombre||'')}</td><td>${esc(p.jornadas?.fecha||'')}</td><td>${esc(p.categoria)}</td><td>${esc(p.modalidad)}</td><td><b>${esc(p.equipo_a)}</b> vs <b>${esc(p.equipo_b)}</b></td><td>${resultado(p)}</td><td class="gan">${ganador(p)}</td><td><a class="btn" href="cargar_resultado.html?partido=${encodeURIComponent(p.id)}">Ver / corregir</a></td></tr>`).join('')}</tbody></table>`;
}
sel.onchange=cargar;
(async()=>{
 const r=await NewcomSupabase.listarTorneos();
 if(!r.ok){c.textContent='Error: '+r.error;return;}
 const act=(r.data||[]).filter(t=>t.estado==='ACTIVO');
 if(!act.length){sel.innerHTML='<option>Sin torneos activos</option>';sel.disabled=true;c.textContent='No hay torneos activos.';return;}
 sel.innerHTML=act.map(t=>`<option value="${esc(t.id)}">${esc(t.nombre)}</option>`).join('');
 const q=new URLSearchParams(location.search).get('torneo');if(q&&act.some(t=>String(t.id)===String(q)))sel.value=q;
 await cargar();
})();
</script><script src="guia_organizador_v12_35.js?v=12.35"></script>
<script src="tornewcom_icons.js?v=12.36.19"></script><script src="tornewcom_tooltips.js?v=12.36.19"></script>
<script src="tornewcom_session_ui.js?v=12.36.19-login5"></script>
</body></html>
