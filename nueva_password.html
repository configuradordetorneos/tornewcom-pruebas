<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TorNewcom — Recuperación de contraseña · V12.37.40</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;color:#123453;background:linear-gradient(rgba(5,29,53,.45),rgba(5,29,53,.58)),url("tornewcom-fondo-limpio.jpg") center/cover fixed no-repeat}
.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(460px,100%);background:rgba(255,255,255,.96);border-radius:20px;padding:25px 28px;box-shadow:0 20px 50px rgba(0,16,36,.34)}
h1{margin:0;color:#0d4079;font-size:29px;text-align:center}.sub{text-align:center;color:#5d7386;font-size:13px;line-height:1.45;margin:8px 0 20px}.field{margin-bottom:12px}label{display:block;font-weight:700;color:#17446e;margin-bottom:5px;font-size:13px}
input{width:100%;height:42px;padding:9px 12px;border:1px solid #b9cad9;border-radius:9px;font-size:14px;outline:none}input:focus{border-color:#2a78c5;box-shadow:0 0 0 3px rgba(42,120,197,.11)}
button,.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:42px;border:0;border-radius:9px;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#2679d6,#155ca9);color:#fff;margin-top:15px}.secondary{background:#edf3f8;color:#245577;margin-top:9px}.show-pass{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:#536d84;font-weight:600}.show-pass input{width:auto;height:auto;margin:0}
.msg{display:none;margin-top:12px;padding:11px;border-radius:9px;font-size:13px;font-weight:700;line-height:1.4}.ok{background:#e7f4ec;color:#2f7253}.err{background:#fdecec;color:#9a2626}.loading{display:block;background:#EAF4FB;color:#2F5D7E}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=12.35"></script>
<script src="supabase_v12_24.js?v=12.37.40"></script>
<script>
function mostrar(){const v=document.getElementById('mostrarPass').checked;document.getElementById('pass').type=v?'text':'password';document.getElementById('pass2').type=v?'text':'password'}
async function preparar(){
  const m=document.getElementById('msg'),f=document.getElementById('form');
  m.className='msg loading';m.textContent='Validando enlace de recuperación…';m.style.display='block';f.style.display='none';
  const rr=await NewcomSupabase.esperarRecuperacionPassword(8000);
  if(!rr.ok){
    m.className='msg err';
    m.textContent='Este enlace ya no es válido. Solicitá uno nuevo para recuperar tu contraseña.';
    document.getElementById('volverRecuperar').style.display='flex';
    return;
  }
  m.style.display='none';f.style.display='block';
}
async function cambiar(ev){
  ev.preventDefault();
  const p=document.getElementById('pass').value,p2=document.getElementById('pass2').value,m=document.getElementById('msg'),b=document.getElementById('btn');
  m.style.display='none';
  if(p.length<8){m.className='msg err';m.textContent='La contraseña debe tener al menos 8 caracteres.';m.style.display='block';return false}
  if(p!==p2){m.className='msg err';m.textContent='Las contraseñas no coinciden.';m.style.display='block';return false}
  b.disabled=true;b.textContent='Guardando…';
  const r=await NewcomSupabase.actualizarPasswordRecuperacion(p);
  if(!r.ok){m.className='msg err';m.textContent='No se pudo cambiar la contraseña: '+r.error;m.style.display='block';b.disabled=false;b.textContent='Guardar nueva contraseña';return false}
  b.textContent='Contraseña actualizada ✓';
  document.getElementById('pass').value='';document.getElementById('pass2').value='';
  document.getElementById('pass').disabled=true;document.getElementById('pass2').disabled=true;document.getElementById('mostrarPass').disabled=true;
  m.className='msg ok';m.textContent='Contraseña actualizada correctamente. Ya podés ingresar con tu nueva contraseña.';m.style.display='block';document.getElementById('irIngreso').style.display='flex';
  try{localStorage.removeItem('sesionNewcom');await NewcomSupabase.cerrarSesionAuth()}catch(_){}
  return false;
}
window.addEventListener('DOMContentLoaded',preparar);
</script>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2F5D7E"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="TorNewcom"><link rel="apple-touch-icon" href="icon-192.png"></head>
<body><div class="wrap"><section class="card">
<h1>Recuperación de contraseña</h1><div class="sub">Elegí una nueva contraseña para tu cuenta de TorNewcom.</div>
<form id="form" onsubmit="cambiar(event)" style="display:none">
<div class="field"><label for="pass">Nueva contraseña</label><input id="pass" type="password" minlength="8" required autocomplete="new-password"></div>
<div class="field"><label for="pass2">Repetir contraseña</label><input id="pass2" type="password" minlength="8" required autocomplete="new-password"><label class="show-pass"><input id="mostrarPass" type="checkbox" onchange="mostrar()"> Mostrar contraseña</label></div>
<button id="btn" class="primary" type="submit">Guardar nueva contraseña</button>
</form>
<div id="msg" class="msg"></div>
<a id="volverRecuperar" class="btn secondary" href="recuperar_password.html" style="display:none">Solicitar un nuevo enlace</a>
<a id="irIngreso" class="btn secondary" href="acceso_real.html" style="display:none">Ir a Ingresar</a>
</section></div><script src="tornewcom_tooltips.js?v=12.36.19"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=12.37.40').catch(()=>{}));}</script></body></html>
