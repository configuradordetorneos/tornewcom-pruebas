<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TorNewcom — Recuperar contraseña · V12.37.39</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;color:#123453;background:linear-gradient(rgba(5,29,53,.45),rgba(5,29,53,.58)),url("tornewcom-fondo-limpio.jpg") center/cover fixed no-repeat}
.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(450px,100%);background:rgba(255,255,255,.96);border-radius:20px;padding:25px 28px;box-shadow:0 20px 50px rgba(0,16,36,.34)}
h1{margin:0;color:#0d4079;font-size:27px;text-align:center}.sub{text-align:center;color:#5d7386;font-size:13px;line-height:1.45;margin:8px 0 20px}.field{margin-bottom:12px}label{display:block;font-weight:700;color:#17446e;margin-bottom:5px;font-size:13px}
input{width:100%;height:42px;padding:9px 12px;border:1px solid #b9cad9;border-radius:9px;font-size:14px;outline:none}input:focus{border-color:#2a78c5;box-shadow:0 0 0 3px rgba(42,120,197,.11)}
button,.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:42px;border:0;border-radius:9px;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(90deg,#2679d6,#155ca9);color:#fff;margin-top:15px}.secondary{background:#edf3f8;color:#245577;margin-top:9px}
.note{background:#EAF4FB;color:#2F5D7E;padding:12px;border-radius:10px;font-size:12px;line-height:1.45;margin:14px 0}.msg{display:none;margin-top:12px;padding:11px;border-radius:9px;font-size:13px;font-weight:700;line-height:1.4}.ok{background:#e7f4ec;color:#2f7253}.err{background:#fdecec;color:#9a2626}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=12.35"></script>
<script src="supabase_v12_24.js?v=12.37.39"></script>
<script>
function emailValido(v){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim().toLowerCase())}
async function solicitar(ev){
  ev.preventDefault();
  const e=document.getElementById('email').value.trim().toLowerCase();
  const m=document.getElementById('msg'),b=document.getElementById('btn');
  m.style.display='none';
  if(!emailValido(e)){m.className='msg err';m.textContent='Ingresá un email válido, por ejemplo nombre@correo.com.';m.style.display='block';return false}
  b.disabled=true;b.textContent='Enviando…';
  try{
    const r=await NewcomSupabase.solicitarRecuperacionPassword(e);
    if(!r.ok)throw new Error(r.error||'No se pudo enviar el enlace.');
    m.className='msg ok';
    m.textContent='Si existe una cuenta con ese email, vas a recibir un enlace para crear una nueva contraseña. Revisá también Spam o Correo no deseado.';
    m.style.display='block';
  }catch(err){m.className='msg err';m.textContent='No se pudo solicitar la recuperación: '+(err?.message||String(err));m.style.display='block'}
  b.disabled=false;b.textContent='Enviar enlace de recuperación';
  return false;
}
</script>
</head>
<body><div class="wrap"><section class="card">
<h1>Recuperar contraseña</h1>
<div class="sub">Ingresá el email de tu cuenta de TorNewcom.</div>
<div class="note">Te enviaremos un enlace para elegir una nueva contraseña.</div>
<form onsubmit="solicitar(event)"><div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="tu@email.com"></div><button id="btn" class="primary" type="submit">Enviar enlace de recuperación</button></form>
<div id="msg" class="msg"></div>
<a class="btn secondary" href="acceso_real.html">← Volver a Ingresar</a>
</section></div><script src="tornewcom_tooltips.js?v=12.36.19"></script>
</body></html>
