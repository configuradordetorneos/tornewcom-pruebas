<head>
<meta charset="utf-8">

<title>Mis jornadas — V12.37.40 — TorNewcom</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f7fa;color:#243746;margin:0}.top{background:#2F5D7E;color:#fff;padding:18px 24px}.wrap{max-width:1180px;margin:26px auto;padding:0 16px}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 6px 18px rgba(32,72,98,.08)}.btn{display:inline-block;background:#4A90C2;color:#fff;padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:bold}.secondary{background:#6c7f8d}.msg{padding:12px;background:#EAF4FB;border-radius:9px}select{padding:9px;border:1px solid #bdcbd5;border-radius:8px;min-width:300px;max-width:100%}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:11px;border-bottom:1px solid #dbe5eb;text-align:left}th{background:#2F5D7E;color:#fff}tbody tr:nth-child(even){background:#EAF4FB}.muted{color:#687d8a;font-size:13px}.estado{font-weight:bold}.fin{color:#2f6c3a}.pen{color:#795f22}.sus{color:#9a5a13}.jornada{margin:0 0 28px}.jornada h2{margin:0 0 4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}@media(max-width:760px){.wrap{padding:0 10px}.card{padding:16px}.scroll{overflow:auto}table{min-width:760px}}
</style>

<body>
<script src="roles_v12_24.js?v=12.35"></script>
<script>NewcomRoles.exigir(['RESPONSABLE']);</script>
<div class="top"><b>TORNEWCOM — V12.37.40 PRUEBAS</b></div>
<main class="wrap">
<p><a class="btn secondary" href="index.html">← Inicio</a></p>
<div class="card">
<h1>Mis jornadas</h1>
<p class="muted">Consultá las jornadas donde participa alguno de tus equipos. Incluye partidos pendientes, suspendidos y jugados. Esta pantalla es solo de consulta.</p>
<p><b>Torneo e institución:</b> <select id="asignacion"></select></p>
<div class="toolbar"><a class="btn" id="irPartidos" href="partidos.html?modo=responsable">Mis partidos jugados</a><a class="btn secondary" id="irTabla" href="tabla.html?modo=responsable">Tabla de posiciones</a></div>
<div id="contenido" class="msg" style="margin-top:16px">Cargando…</div>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=12.35"></script>
<script src="supabase_v12_24.js?v=12.37.40"></script>
<script>
const sesion=NewcomRoles.sesion();
const asignacionSel=document.getElementById('asignacion');
const contenido=document.getElementById('contenido');
let asignaciones=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function fmtFecha(v){if(!v)return '';const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1].slice(2)}`:String(v)}
function asignacionActual(){return asignaciones.find(a=>String(a.id)===String(asignacionSel.value))||null;}
async function cargar(){
 const a=asignacionActual();
 if(!a){contenido.className='msg';contenido.textContent='No hay una institución seleccionada.';return;}
 const tid=a.torneo_id;
 document.getElementById('irPartidos').href='partidos.html?modo=responsable&torneo='+encodeURIComponent(tid);
 document.getElementById('irTabla').href='tabla.html?modo=responsable&torneo='+encodeURIComponent(tid);
 const r=await NewcomSupabase.listarPartidos(tid);
 if(!r.ok){contenido.className='msg';contenido.textContent='No se pudieron cargar las jornadas: '+r.error;return;}
 const permitidos={ids:new Set((a.equipos_competitivos||[]).map(e=>String(e.id))),nombres:new Set((a.equipos_competitivos||[]).map(e=>e.nombre))};
 const esMio=(p,lado)=>{const id=lado==='A'?p.equipo_a_id:p.equipo_b_id,n=lado==='A'?p.equipo_a:p.equipo_b;return id?permitidos.ids.has(String(id)):permitidos.nombres.has(n);};
 const lista=(r.data||[]).filter(p=>esMio(p,'A')||esMio(p,'B'));
 if(!lista.length){contenido.className='msg';contenido.textContent='Todavía no hay jornadas programadas para los equipos de esta institución en este torneo.';return;}
 const grupos=new Map();
 for(const p of lista){
   const nombre=p.jornadas?.nombre||'Jornada';
   const fecha=p.jornadas?.fecha||'';
   const key=nombre+'|'+fecha;
   if(!grupos.has(key))grupos.set(key,{nombre,fecha,partidos:[]});
   grupos.get(key).partidos.push(p);
 }
 const orden=[...grupos.values()].sort((x,y)=>String(x.fecha||'').localeCompare(String(y.fecha||''))||String(x.nombre).localeCompare(String(y.nombre),'es'));
 orden.forEach(g=>g.partidos.sort((a,b)=>String(a.hora||'99:99').localeCompare(String(b.hora||'99:99'))||String(a.equipo_a||'').localeCompare(String(b.equipo_a||''),'es')));
 contenido.className='';
 contenido.innerHTML=orden.map((g,idx)=>`<section class="jornada"><h2>${esc(g.nombre)}</h2><div class="muted">${esc(fmtFecha(g.fecha)||'Fecha a confirmar')}</div><div class="scroll"><table><thead><tr><th>Hora</th><th>Sede</th><th>Cancha</th><th>Categoría</th><th>Mi equipo</th><th>Rival</th><th>Estado</th></tr></thead><tbody>${g.partidos.map(p=>{const aMio=esMio(p,'A'),bMio=esMio(p,'B');const mio=aMio?p.equipo_a:p.equipo_b;const rival=aMio?p.equipo_b:p.equipo_a;const ambos=aMio&&bMio;const sede=p.sedes_torneo;const sedeHtml=sede?`<span title="${esc(sede.domicilio||'')}">${esc(sede.nombre)}</span>`:'—';return `<tr><td>${esc(p.hora||'A confirmar')}</td><td>${sedeHtml}</td><td>${esc(p.cancha||'A confirmar')}</td><td>${esc(p.categoria)} · ${esc(p.modalidad)}</td><td><b>${esc(ambos?(p.equipo_a+' / '+p.equipo_b):mio)}</b></td><td>${esc(ambos?'—':rival)}</td><td class="estado ${p.estado==='FINALIZADO'?'fin':(p.estado==='SUSPENDIDO'?'sus':'pen')}">${esc(p.estado||'PENDIENTE')}</td></tr>`;}).join('')}</tbody></table></div></section>`).join('');
}
(async()=>{
 const ar=await NewcomSupabase.listarAsignacionesResponsable(sesion.email);
 if(!ar.ok){contenido.textContent='No se pudieron cargar tus asignaciones: '+ar.error;return;}
 asignaciones=(ar.data||[]).filter(a=>a.torneo?.estado!=='ARCHIVADO');
 if(!asignaciones.length){asignacionSel.innerHTML='<option>Sin asignación</option>';asignacionSel.disabled=true;contenido.textContent='El Organizador todavía no te asignó una institución.';return;}
 asignacionSel.innerHTML=asignaciones.map(a=>`<option value="${esc(a.id)}">${esc(a.torneo?.nombre||'Torneo')} — ${esc(a.nombre)}</option>`).join('');
 const qs=new URLSearchParams(location.search),qid=qs.get('institucion'),qt=qs.get('torneo');
 let elegida=asignaciones.find(a=>String(a.id)===String(qid)&&(!qt||String(a.torneo_id)===String(qt)))||asignaciones.find(a=>String(a.torneo_id)===String(qt))||asignaciones[0];
 asignacionSel.value=elegida.id;
 if(asignaciones.length===1)asignacionSel.disabled=true;
 await cargar();
})();
asignacionSel.onchange=cargar;
</script>

</html>
